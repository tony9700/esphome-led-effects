# Eksempel: ESP8266 ESP-07S med WS2811. Tilpass lokalt.
esphome:
  name: led-tv-stue-eksempel

esp8266:
  board: esp07s

logger:
  baud_rate: 0
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  led_animasjoner:
    url: https://github.com/tony9700/esphome-led-effects
    files:
      - effects/common.yaml
    ref: main
    refresh: 5min

light:
  - platform: neopixelbus
    id: stripe
    name: "TV stue tak"
    type: RGB
    variant: WS2811
    pin: GPIO0
    num_leds: 64
    color_correct: [90%, 90%, 90%]
    restore_mode: RESTORE_DEFAULT_OFF
    # Alle effektene hentes fra GitHub.
